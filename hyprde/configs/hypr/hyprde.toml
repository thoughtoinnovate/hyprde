# =============================================================================
# HyprDE Configuration File
# =============================================================================
# This is the main configuration file for HyprDE (Hyprland Desktop Environment)
# For full schema documentation, see CONFIG_SCHEMA.md
#
# Quick reference:
#   - TOML format: https://toml.io/
#   - Arrays use [] and can span multiple lines
#   - Strings must be quoted with "double quotes"
#   - Booleans are true/false (lowercase, no quotes)
#   - Tables (sections) use [section.subsection] syntax
# =============================================================================

# =============================================================================
# THEME
# Visual theme and accent color
# Modes: "dark", "light", "auto" (follows time of day)
# =============================================================================
[theme]
mode = "dark"
accent = "#007aff"

# =============================================================================
# MONITORS
# Configure your display outputs
# Format: "name, resolution, position, scale"
#   - name: Monitor identifier or empty (,) for wildcard
#   - resolution: preferred, highres, highrr, or WIDTHxHEIGHT@RATE
#   - position: auto or XxY coordinates
#   - scale: Float value (1.0 = 100%, 1.5 = 150%, 2.0 = 200%)
# =============================================================================
[monitors]
rules = [
    ", highres, auto, 1.0",                # Match any monitor with high resolution
    "HDMI-A-1, 1920x1080@120, auto, 1"    # Specific monitor at 1080p 120Hz
]

# =============================================================================
# PROGRAMS
# Default applications for various actions
# These define variables like $terminal, $fileManager used in keybindings
# =============================================================================
[programs]
terminal = "ghostty"                      # Terminal emulator (SUPER+T)
fileManager = "thunar"                    # File manager (SUPER+E)
launcher = "hyprsearch"                     # Native GTK3 launcher
launcher_cmd = "hyprsearch"               # Native spotlight launcher
notification_service = "mako"             # Notification daemon
status_bar = "waybar"                     # Status bar program
autohide_bar = false                      # Autohide status bar (use SUPER+B to toggle)

# =============================================================================
# AUTOSTART
# Applications to launch when Hyprland starts
# These run once at startup (not on reload)
# =============================================================================
[autostart]
exec_once = [
    "/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1",
    "$notification_service",
    "$status_bar",
    "hyprpaper -c $HOME/.config/hypr/hyprpaper.conf",
    "hypridle",
    "blueman-applet"
]

# =============================================================================
# WALLPAPERS
# Wallpaper management configuration
# Supports three modes: dynamic (time-based), fixed (static), or disabled
# Requires hyprpaper to be running
# 
# DIRECTORY STRUCTURE (created automatically by install.sh):
# ~/Pictures/wallpapers/
# ├── sunrise/          # Morning & afternoon wallpapers (6:00 AM - 6:00 PM)
# ├── sunset/           # Evening & night wallpapers (6:00 PM - 10:00 PM)
# └── favorites/        # Fixed mode wallpapers (single image or collection)
#
# Use 'SUPER+C' (Settings Manager) to switch modes and configure times
# =============================================================================
[wallpapers]
mode = "fixed"                            # Options: "dynamic", "fixed", "disabled"
enable_dynamic = true                     # Backward compatibility (kept for old configs)
splash = false                            # Disable random splash text/quotes
path = "$HOME/Pictures/wallpapers/"       # Base directory (see structure above)
interval = 60                             # Seconds between wallpaper changes (dynamic mode only)

# FIXED MODE CONFIGURATION
# Use single image or random from directory (static - never changes)
[wallpapers.fixed]
type = "image"                            # Options: "image" (single file) or "directory" (random)
image = "$HOME/Pictures/wallpapers/wall0.png"  # Full path to wallpaper image
# directory = "$HOME/Pictures/wallpapers/favorites/"        # Alternative: random from directory

# DYNAMIC MODE CONFIGURATION
# Time-based wallpaper switching with automatic directory selection
# Three slots: morning (6AM-12PM), noon (12PM-6PM), evening (6PM-6AM)
[wallpapers.schedule]
morning_start = "6:00 AM"                 # 6:00 AM - Switch to morning wallpapers
noon_start = "12:00 PM"                   # 12:00 PM - Switch to noon wallpapers
evening_start = "6:00 PM"                 # 6:00 PM - Switch to evening wallpapers (covers night too)

[wallpapers.directories]
morning = "morning"                       # Directory for morning (6 AM - 12 PM)
noon = "noon"                             # Directory for noon/afternoon (12 PM - 6 PM)
evening = "evening"                       # Directory for evening/night (6 PM - 6 AM)

# =============================================================================
# LOCK SCREEN
# Visual configuration for the lock screen (hyprlock)
# =============================================================================
[lockscreen]
background = "$HOME/Pictures/wallpapers/wall1.png" # Background image path
profile_image = "$HOME/.face"                      # User profile picture
enable_profile_image = true                        # Show profile picture
blur_passes = 3                                    # Blur intensity (0 to disable)
blur_size = 8                                      # Blur size
fail_text = "<i>$FAIL <b>($ATTEMPTS)</b></i>"      # Text to show on login failure
placeholder_text = "<i>Input Password...</i>"      # Placeholder text

# =============================================================================
# IDLE
# Automatic screen locking and power management (Timeouts)
# Times are in seconds
# =============================================================================
[idle]
lock_timeout = 300                        # Lock screen after 5 minutes (300s)
screen_off_timeout = 330                  # Turn off display after 5.5 minutes
suspend_timeout = 1800                    # Suspend after 30 minutes (1800s)

# =============================================================================
# NIGHTLIGHT
# Blue light filter using gammastep
# Color temperature in Kelvin (1000-6500, lower = warmer/redder)
# =============================================================================
[nightlight]
enabled = true                           # Enable night light filter
temp_day = 6500                           # Daytime color temperature (cool/blue)
temp_night = 3400                         # Nighttime color temperature (warm/orange)
mode = "auto"
blue_intensity = 0.60                     # Blue light reduction (0.0 to 1.0, lower is warmer)
green_intensity = 0.85                    # Green light reduction (0.0 to 1.0)
# =============================================================================
# PLUGINS
# Hyprland plugin management via hyprpm
# Enable plugins and configure their settings
# NOTE: Plugins must be installed via hyprpm before enabling them here
#   Example: hyprpm enable <plugin-name>
# =============================================================================
[plugins]
manage_official = true                    # Enable hyprpm official plugin repo
enabled = []                              # Enable plugins here (e.g. ["hyprexpo"])

# native scrolling layout - integrated into Hyprland 0.54.0+
[scrolling]
column_width = 0.5                        # Column width multiplier
fullscreen_on_one_column = true           # Auto-fullscreen single column
focus_fit_method = 0                      # 0 = center focused, 1 = fit to screen
explicit_column_widths = "0.333, 0.5, 0.667, 1.0" # Widths to cycle through

# =============================================================================
# LAUNCHER (hyprsearch)
# High-performance native GTK3 launcher configuration
# =============================================================================
[launcher]
width_percent = 70                        # Global default width
rounding = 24                             # Global default rounding
border_size = 1                           # Global default border
# LAUNCHER COLORS (Optional overrides - uncomment to follow system theme)
# border_color = "rgba(51, 204, 255, 0.3)"
# bg_color = "rgba(30, 30, 30, 0.95)"
# fg_color = "#ffffff"
# sel_bg_color = "rgba(255, 255, 255, 0.1)"
# sel_fg_color = "#ffffff"
# sel_shadow_color = "rgba(255, 255, 255, 0.05)"
font_size = 24                            # Main entry font size
row_spacing = 10                          # Spacing between rows
icon_size = 32                            # Icon size in pixels

# DRUN MODE (App Launcher)
[launcher.drun]
position = "top"
margin_top = 100
width_percent = 60

# POWER MENU MODE
[launcher.power_menu]
position = "center"
width_percent = 40

# DMENU MODE (Used by scripts)
[launcher.dmenu]
position = "center"
width_percent = 50

# MAC-LIKE DOCK CONFIGURATION
[launcher.dock]
enabled = true
autohide = true                           # Hide dock when not hovered
position = "bottom"                       # bottom, left, right
icon_size = 48                            # Icon size
padding = 12                              # Inner padding
rounding = 24                             # Shelf rounding
margin = 10                               # Screen edge offset
apps = [                                  # Persistent apps
    "ghostty",
    "thunar",
    "firefox",
    "code",
    "spotify"
]

# =============================================================================
# HYPRROCKET
# OS Automation Event Bus
# Triggers scripts at specific times via systemd timers
# =============================================================================
[hyprrocket]
enabled = true

[hyprrocket.events.morning]
trigger = "06:00"                          # 6:00 AM
action = "theme-ctrl.sh --mode auto"       # Automatic theme transition

[hyprrocket.events.evening]
trigger = "18:00"                          # 6:00 PM
action = "theme-ctrl.sh --mode auto"       # Automatic theme transition

# =============================================================================
# GESTURES
# Native Hyprland trackpad gestures (hl.gesture() calls)
# Format: "field1 = value1, field2 = value2, ..."
# Fields: fingers (int), direction (quoted string), action (quoted string),
#         mods (quoted string, optional), scale (number, optional)
# =============================================================================
[gesture]
list = [
    # 3-finger horizontal swipe for workspace switching
    'fingers = 3, direction = "horizontal", action = "workspace"',
]

# =============================================================================
# SUBMAPS
# Keyboard modes (submaps) for complex keybindings
# Each submap defines a mode with its own keybindings
# =============================================================================
# (expo submap removed - hyprexpo plugin not enabled)

# =============================================================================
# ENV
# Environment variables for the Hyprland session
# Format: "KEY,VALUE"
# =============================================================================
[env]
vars = [
    "XCURSOR_SIZE,24",                    # Cursor size in pixels
    "HYPRCURSOR_SIZE,24",                 # Hyprcursor size
    "WLR_DRM_DEVICES,/dev/dri/card1",     # GPU device selection
    "GDK_SCALE,1.3",                      # GTK application scaling
    "binds:allow_workspace_cycles,true"   # Allow cycling through workspaces
]

# =============================================================================
# INPUT
# Input device configuration (keyboard, mouse, touchpad)
# =============================================================================
[input]
# Keyboard settings
kb_layout = "us"                          # Keyboard layout (us, de, fr, etc.)
kb_variant = ""                           # Keyboard variant
kb_model = ""                             # Keyboard model
kb_options = "caps:escape"                # XKB options (caps to escape)
kb_rules = ""                             # XKB rules

# Mouse settings
follow_mouse = 1                          # Focus follows mouse (0=off, 1=on)
sensitivity = 0                           # Mouse sensitivity (-1.0 to 1.0)

# Touchpad subsection
[input.touchpad]
natural_scroll = false                    # Reverse scroll direction

# =============================================================================
# GENERAL
# General window management and appearance settings
# =============================================================================
[general]
gaps_in = 5                               # Inner gaps between windows (px)
gaps_out = 20                             # Outer gaps from screen edges (px)
border_size = 2                           # Window border thickness (px)

# Border colors (rgba format or gradient)
col_active_border = "rgba(33ccffee) rgba(00ff99ee) 45deg"
col_inactive_border = "rgba(595959aa)"

resize_on_border = false                  # Allow resize by dragging border
allow_tearing = false                     # Allow screen tearing (low latency)
layout = "scroll"                         # Default layout (dwindle, master, or scroll)

# =============================================================================
# DECORATION
# Window decoration settings (borders, opacity, blur)
# =============================================================================
[decoration]
rounding = 10                             # Window corner radius (px)
active_opacity = 1.0                      # Active window opacity (0.0-1.0)
inactive_opacity = 1.0                    # Inactive window opacity (0.0-1.0)
waybar_opacity = 0.5                      # Status bar opacity (0.0-1.0)
wofi_opacity = 0.95                       # Launcher opacity (0.0-1.0)

# Blur effect subsection
[decoration.blur]
enabled = true                            # Enable blur
size = 3                                  # Blur radius
passes = 1                                # Blur passes
vibrancy = 0.1696                         # Blur vibrancy

# =============================================================================
# ANIMATIONS
# Window and workspace animation settings
# Format: "enabled, speed, curve, [style]"
# =============================================================================
[animations]
enabled = true                            # Enable animations
bezier = "myBezier, 0.05, 0.9, 0.1, 1.05" # Custom bezier curve definition

# Animation configurations
windows = "1, 7, myBezier"                # Window open animation
windowsOut = "1, 7, default, popin 80%"   # Window close animation
border = "1, 10, default"                 # Border animation
borderangle = "1, 8, default"             # Border angle animation
fade = "1, 7, default"                    # Fade animation
workspaces = "1, 6, default"              # Workspace switch animation

# =============================================================================
# DWINDLE
# Dwindle (fibonacci spiral) layout settings
# =============================================================================
[dwindle]
preserve_split = true                     # Keep split orientation

# =============================================================================
# MASTER
# Master-stack layout settings
# =============================================================================
[master]
new_status = "master"                     # New window position (master/master)

# =============================================================================
# MISC
# Miscellaneous settings
# =============================================================================
[misc]
force_default_wallpaper = 0               # Force default wallpaper (0-2). Set to 0 to disable.
disable_hyprland_logo = true              # Disable startup logo
disable_splash_rendering = true           # Disable splash text rendering

# =============================================================================
# BINDS
# Keyboard and mouse bindings
# Available prefixes: bind, bindr (release), bindm (mouse), 
#                     binde (repeat), bindl (locked)
# Format: "MODIFIERS, KEY, DISPATCHER, ARGUMENTS"
# =============================================================================
[binds]
mainMod = "SUPER"                         # Main modifier key (SUPER/ALT/CTRL)

# Normal keybindings
[binds.normal]
list = [
    # Window management
    "$mainMod, T, exec, $terminal",                       # Open terminal
    "$mainMod SHIFT, B, exec, $HOME/.config/hypr/scripts/waybars.sh toggle-main", # Toggle Status Bar
    "$mainMod, Q, killactive,",                           # Close window
    "$mainMod, M, fullscreen,1,",                         # Fullscreen
    "$mainMod, E, exec, $fileManager",                   # Open file manager
    "$mainMod, V, togglefloating,",                       # Toggle floating
    "$mainMod, L, exec, hyprlock",                       # Lock screen
    "$mainMod, P, layoutmsg, promote",                    # Promote to new column (Scroll layout)
    "$mainMod, J, togglesplit,",                          # Toggle split (Dwindle)
    
    # Focus movement
    "$mainMod, left, movefocus, l",
    "$mainMod, right, movefocus, r",
    "$mainMod, up, movefocus, u",
    "$mainMod, down, movefocus, d",
    
    # Workspaces (1-10)
    "$mainMod, 1, workspace, 1",
    "$mainMod, 2, workspace, 2",
    "$mainMod, 3, workspace, 3",
    "$mainMod, 4, workspace, 4",
    "$mainMod, 5, workspace, 5",
    "$mainMod, 6, workspace, 6",
    "$mainMod, 7, workspace, 7",
    "$mainMod, 8, workspace, 8",
    "$mainMod, 9, workspace, 9",
    "$mainMod, 0, workspace, 10",
    
    # Move windows to workspaces
    "$mainMod SHIFT, 1, movetoworkspace, 1",
    "$mainMod SHIFT, 2, movetoworkspace, 2",
    "$mainMod SHIFT, 3, movetoworkspace, 3",
    "$mainMod SHIFT, 4, movetoworkspace, 4",
    "$mainMod SHIFT, 5, movetoworkspace, 5",
    "$mainMod SHIFT, 6, movetoworkspace, 6",
    "$mainMod SHIFT, 7, movetoworkspace, 7",
    "$mainMod SHIFT, 8, movetoworkspace, 8",
    "$mainMod SHIFT, 9, movetoworkspace, 9",
    "$mainMod SHIFT, 0, movetoworkspace, 10",
    
    # Special workspace
    "$mainMod, S, togglespecialworkspace, magic",
    "$mainMod SHIFT, S, movetoworkspace, special:magic",
    
    # Workspace navigation
    "$mainMod, mouse_down, workspace, e+1",
    "$mainMod, mouse_up, workspace, e-1",
    "$mainMod, TAB, workspace, e+1",
    "$mainMod CTRL, RIGHT, workspace, e-1",
    "$mainMod CTRL, LEFT, workspace, e+1",
    
    # Window movement
    "$mainMod ALT, left, movewindow, l",
    "$mainMod ALT, right, movewindow, r",
    "$mainMod ALT, up, movewindow, u",
    "$mainMod ALT, down, movewindow, d",
    
    # Scroll Layout Control
    "$mainMod, comma, layoutmsg, togglesplit",
    "$mainMod, period, layoutmsg, togglesplit",
    "$mainMod SHIFT, period, layoutmsg, promote",
    "$mainMod SHIFT, comma, layoutmsg, movewindowto l",
    "$mainMod CTRL, comma, layoutmsg, togglegroup",
    "$mainMod CTRL, period, layoutmsg, exitgroup",
    "$mainMod, R, layoutmsg, colresize +conf",
    "$mainMod, F, layoutmsg, togglefit",
    
    # Layout control (Universal/Other)
    "$mainMod, K, layoutmsg, swaptomaster",
    "$mainMod, A, layoutmsg, addmaster",
    "$mainMod, D, layoutmsg, removemaster",
    
    # (SUPER+G freed - hyprexpo plugin not enabled)
    
    # Scripts and utilities
    "$mainMod SHIFT, f, exec, $HOME/.config/hypr/scripts/file_search.sh",
    "$mainMod SHIFT, slash, exec, $HOME/.config/hypr/scripts/any_finder.sh",
    "$mainMod ALT, M, exec, $HOME/.config/hypr/scripts/mic.sh toggle",
    "$mainMod ALT, V, exec, $HOME/.config/hypr/scripts/camera.sh toggle",
    "$mainMod ALT, W, exec, $HOME/.config/hypr/scripts/wallpaper-ctrl.sh toggle",
    "$mainMod ALT, R, exec, $HOME/.config/hypr/scripts/screen-record.sh toggle",
    "$mainMod ALT, L, exec, $HOME/.config/hypr/scripts/layout-ctrl.sh",
    "$mainMod CTRL, C, exec, $HOME/.config/hypr/scripts/waybars.sh ctrl-cntr",
    "$mainMod CTRL, M, exec, $HOME/.config/hypr/scripts/waybars.sh sys-metrics",
    "$mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh area",
    ", Print, exec, ~/.config/hypr/scripts/screenshot.sh",
    ", escape, exec, $HOME/.config/hypr/scripts/waybars.sh close-all",
    "$mainMod SHIFT, H, exec, $HOME/.config/hypr/scripts/shortcuts-help.sh",
    "$mainMod, C, exec, $HOME/.config/hypr/scripts/settings_manager.py",
    "$mainMod, D, exec, $HOME/.config/hypr/scripts/dock-toggle.sh"
]

# Key release bindings
[binds.release]
list = [
    "$mainMod, space, exec, $HOME/.config/hypr/scripts/spotlight_wrapper.sh"
]

# Mouse bindings
[binds.mouse]
list = [
    "$mainMod, mouse:272, movewindow",      # Left click drag
    "$mainMod, mouse:273, resizewindow"     # Right click drag
]

# Repeating key bindings (for continuous resize)
[binds.repeat]
list = [
    "$mainMod SHIFT, up, resizeactive, 0 -10",
    "$mainMod SHIFT, down, resizeactive, 0 10",
    "$mainMod SHIFT, left, resizeactive, -10 0",
    "$mainMod SHIFT, right, resizeactive, 10 0",
    ", XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness-ctrl.sh --inc",
    ", XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness-ctrl.sh --dec",
    ", XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/audio-ctrl.sh --inc",
    ", XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/audio-ctrl.sh --dec"
]

# Locked bindings (work when screen is locked)
[binds.locked]
list = [
    ", XF86AudioMute, exec, ~/.config/hypr/scripts/audio-ctrl.sh --mute"
]

# =============================================================================
# RULES
# Window rules for specific applications
# Format: "ACTION, SELECTOR"
#   - ACTION: float, pin, center, size WIDTH HEIGHT, opacity OPACITY ACTIVE, etc.
#   - SELECTOR: class:REGEX or title:REGEX
# Automatically converted to Hyprland 0.53+ syntax
# =============================================================================
[rules]
window = [
    # Picture-in-Picture windows
    "float, class:^(Picture-in-Picture)$",
    "pin, class:^(Picture-in-Picture)$",
    
    # FZF launcher window styling
    "float, class:(com.fzf.launcher)",
    "size 80% 85%, class:(com.fzf.launcher)",
    "center, class:(com.fzf.launcher)",
    "opacity 0.95 0.95, class:(com.fzf.launcher)",
    "animation slide, class:(com.fzf.launcher)",
    "rounding 10, class:(com.fzf.launcher)"
]
