# Generated from hyprde.toml

# Monitors
monitor = , highres, auto, 1.0
monitor = HDMI-A-1, 1920x1080@120, auto, 1

# Programs
$terminal = ghostty
$fileManager = thunar
$launcher = wofi
$launcher_cmd = wofi --show drun
$notification_service = mako
$status_bar = waybar
$autohide_bar = False

# Autostart
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent-authentication-agent-1
exec-once = $notification_service & $status_bar & hyprpaper & hypridle & blueman-applet
exec-once = sh $HOME/.config/hypr/scripts/init_wallpaper.sh
exec-once = hyprpm reload -n

# Environment
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = WLR_DRM_DEVICES,/dev/dri/card1
env = GDK_SCALE,1.3
env = binds:allow_workspace_cycles,true

# Input
input {
    kb_layout = us
    kb_variant = 
    kb_model = 
    kb_options = caps:escape
    kb_rules = 
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

# General
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# Decoration
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

# Animations
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Dwindle
dwindle {
    pseudotile = true
    preserve_split = true
}

# Master
master {
    new_status = master
}

# Misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Keybindings
$mainMod = SUPER
bind = $mainMod, T, exec, $terminal
bind = $mainMod SHIFT, B, exec, $HOME/.config/hypr/scripts/waybars.sh toggle-main
bind = $mainMod, Q, killactive,
bind = $mainMod, M, fullscreen,1,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, TAB, workspace, e+1
bind = $mainMod CTRL, RIGHT, workspace, e-1
bind = $mainMod CTRL, LEFT, workspace, e+1
bind = $mainMod ALT, left, movewindow, l
bind = $mainMod ALT, right, movewindow, r
bind = $mainMod ALT, up, movewindow, u
bind = $mainMod ALT, down, movewindow, d
bind = $mainMod, comma, layoutmsg, move -col
bind = $mainMod, period, layoutmsg, move +col
bind = $mainMod SHIFT, period, layoutmsg, movewindowto r
bind = $mainMod SHIFT, comma, layoutmsg, movewindowto l
bind = $mainMod, K, layoutmsg, swaptomaster
bind = $mainMod, A, layoutmsg, addmaster
bind = $mainMod, R, layoutmsg, removemaster
bind = $mainMod, F, layoutmsg, cyclenext
bind = $mainMod SHIFT, f, exec, $HOME/.config/hypr/scripts/file_search.sh
bind = $mainMod SHIFT, slash, exec, $HOME/.config/hypr/scripts/any_finder.sh
bind = $mainMod ALT, M, exec, $HOME/.config/hypr/scripts/mic.sh toggle
bind = $mainMod ALT, V, exec, $HOME/.config/hypr/scripts/camera.sh toggle
bind = $mainMod ALT, W, exec, $HOME/.config/hypr/scripts/wallpaper-ctrl.sh toggle
bind = $mainMod ALT, L, exec, $HOME/.config/hypr/scripts/layout-ctrl.sh
bind = $mainMod CTRL, C, exec, $HOME/.config/hypr/scripts/waybars.sh ctrl-cntr
bind = $mainMod CTRL, M, exec, $HOME/.config/hypr/scripts/waybars.sh sys-metrics
bind = $mainMod, Print, exec, $HOME/.config/hypr/scripts/screenshot.sh area
bind = , Print, exec, $HOME/.config/hypr/scripts/screenshot.sh
bind = , escape, exec, $HOME/.config/hypr/scripts/waybars.sh close-all
bind = $mainMod SHIFT, H, exec, $HOME/.config/hypr/scripts/shortcuts-help.sh
bind = $mainMod, C, exec, $HOME/.config/hypr/scripts/settings_manager.py
bindr = $mainMod, space, exec, wofi --show drun --conf $HOME/.config/wofi/config --style $HOME/.config/wofi/style.css
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
binde = $mainMod SHIFT, up, resizeactive, 0 -10
binde = $mainMod SHIFT, down, resizeactive, 0 10
binde = $mainMod SHIFT, left, resizeactive, -10 0
binde = $mainMod SHIFT, right, resizeactive, 10 0
binde = , XF86MonBrightnessUp, exec, $HOME/.config/hypr/scripts/brightness-ctrl.sh --inc
binde = , XF86MonBrightnessDown, exec, $HOME/.config/hypr/scripts/brightness-ctrl.sh --dec
binde = , XF86AudioRaiseVolume, exec, $HOME/.config/hypr/scripts/audio-ctrl.sh --inc
binde = , XF86AudioLowerVolume, exec, $HOME/.config/hypr/scripts/audio-ctrl.sh --dec
bindl = , XF86AudioMute, exec, $HOME/.config/hypr/scripts/audio-ctrl.sh --mute

# Submaps

# Window Rules (Converted to Hyprland 0.54+ syntax)
windowrule = match:class ^(Picture-in-Picture)$, float true
windowrule = match:class ^(Picture-in-Picture)$, pin true
windowrule = match:class (com.fzf.launcher), float true
windowrule = match:class (com.fzf.launcher), size 80% 85%
windowrule = match:class (com.fzf.launcher), center true
windowrule = match:class (com.fzf.launcher), opacity 0.95 0.95
windowrule = match:class (com.fzf.launcher), animation slide
windowrule = match:class (com.fzf.launcher), rounding 10

# Plugin Configuration
plugin {
    hyprscrolling {
        column_width = 0.5
        fullscreen_on_one_column = false
    }
}

# Gestures
hyprexpo-gesture = 3, up, expo
hyprexpo-gesture = 3, down, expo
